apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankbot-web
  labels:
    app: bankbot-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankbot-web
  template:
    metadata:
      labels:
        app: bankbot-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/bankbot-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://api.example.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bankbot-web
spec:
  selector:
    app: bankbot-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
