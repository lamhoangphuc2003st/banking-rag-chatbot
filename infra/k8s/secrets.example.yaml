apiVersion: v1
kind: Secret
metadata:
  name: bankbot-api-secrets
type: Opaque
stringData:
  # Managed Redis connection string. Use rediss:// when the provider requires TLS.
  # Examples:
  # - redis://:password@redis.example.com:6379/0
  # - rediss://default:password@redis.example.com:6380/0
  REDIS_URL: rediss://default:CHANGE_ME@managed-redis.example.com:6380/0

  # Other production secrets used by the API.
  OPENAI_API_KEY: CHANGE_ME
  COHERE_API_KEY: CHANGE_ME
  DATABASE_URL: postgresql+asyncpg://bankbot:CHANGE_ME@postgres.example.com:5432/bankbot
  QDRANT_URL: https://qdrant.example.com
  QDRANT_API_KEY: CHANGE_ME
