apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankbot-api
  labels:
    app: bankbot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankbot-api
  template:
    metadata:
      labels:
        app: bankbot-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/bankbot-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bankbot-api-secrets
            - configMapRef:
                name: bankbot-api-config
          volumeMounts:
            - name: rag-data
              mountPath: /app/data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: rag-data
          persistentVolumeClaim:
            claimName: bankbot-rag-data
---
apiVersion: v1
kind: Service
metadata:
  name: bankbot-api
spec:
  selector:
    app: bankbot-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
