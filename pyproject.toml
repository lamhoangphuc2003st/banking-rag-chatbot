[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietcombank-rag-platform"
version = "0.1.0"
description = "Production-oriented RAG chatbot platform for public Vietcombank information."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "litellm>=1.43,<2.0",
    "numpy>=1.26,<3.0",
    "openai>=1.40,<2.0",
    "opentelemetry-api>=1.24,<2.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "orjson>=3.10,<4.0",
    "prometheus-client>=0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "qdrant-client>=1.11,<2.0",
    "redis[hiredis]>=5.0,<6.0",
    "selectolax>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=24.1,<26.0",
    "tenacity>=8.4.1,<8.5.0",
    "typer>=0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]
eval = [
    "deepeval==1.6.2",
    "mlflow>=2.14,<3.0",
    "ragas>=0.1,<1.0",
]
scraping = [
    "playwright>=1.45,<2.0",
    "scrapy>=2.11,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
