name: keep-alive

# Prevents the Render free-tier backend from spinning down after 15 minutes of
# inactivity by pinging its cheap /health/live endpoint on a schedule.
#
# GitHub cron is best-effort and can drift by several minutes under load, so we
# run every 10 minutes AND ping twice per run (t=0 and t=+5m). Even if one run is
# delayed or skipped, the previous run's second ping keeps the gap under 15m.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# A slow cold start must not overlap the next scheduled run.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEALTH_URL: https://bankbot-api.onrender.com/health/live
    steps:
      - name: Ping (with retries for cold start)
        run: |
          ping() {
            curl -fsS --retry 5 --retry-all-errors --retry-delay 15 \
              --connect-timeout 15 --max-time 90 "$HEALTH_URL" && echo
          }
          ping
          sleep 300
          ping
